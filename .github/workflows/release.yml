name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build universal app and publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check developer tools
        run: |
          # GitHub 的 macOS runner 自带 Xcode / Command Line Tools，这里只做确认。
          # 本地构建才需要按 README 的说明先检查 xcode-select -p，缺了再装。
          if ! xcode-select -p; then
            echo "::error::没有找到 developer directory"
            exit 1
          fi
          swift --version

      - name: Build universal app
        run: ./build.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="dist/HippoShelf-${VERSION}"
          mkdir -p "$OUT"
          cp -R HippoShelf.app "$OUT/"
          cp INSTALL.txt "$OUT/"
          ditto -c -k --norsrc --noextattr --keepParent "$OUT" "dist/HippoShelf-${VERSION}-universal.zip"
          cd dist
          shasum -a 256 "HippoShelf-${VERSION}-universal.zip" > "HippoShelf-${VERSION}-universal.zip.sha256"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: HippoShelf ${{ github.ref_name }}
          draft: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: false
          body: |
            ## HippoShelf ${{ github.ref_name }}

            一只用嘴帮你临时存文件的河马形置物架 · 免费、开源、100% 本地。

            ### 安装
            1. 解压，把 `HippoShelf.app` 拖进「应用程序」
            2. 第一次右键 →「打开」→ 再点「打开」
            3. 提示「已损坏」时：`xattr -dr com.apple.quarantine /Applications/HippoShelf.app`

            通用二进制（arm64 + x86_64），要求 macOS 13+。sha256 见 `.sha256` 文件。

            ---

            A hippo-shaped shelf that holds files for a moment. Free, open source, 100% local.
            Universal binary (arm64 + x86_64), macOS 13+. MIT licensed.

            Unzip, drag to Applications, then right-click → Open the first time.
            Checksum: see the `.sha256` file below.
          files: |
            dist/HippoShelf-*-universal.zip
            dist/HippoShelf-*-universal.zip.sha256
